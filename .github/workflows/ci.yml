name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip_planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trip_planner/requirements.txt
      - run: pip install -r requirements.txt pytest
      # Offline: HTTP and the search client are faked, so no API keys are needed.
      - run: python -m pytest -q
